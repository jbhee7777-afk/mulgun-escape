<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물건 비밀 연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@600;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 레이아웃: 화면 하나짜리 게임. 상단 바 + 화면(홈·이야기·지도·방·차시) + 전체 화면 연출 레이어 */
:root{
  --night:#141a3d; --night2:#1e2660; --panel:#252e6e; --line:#3b4699;
  --paper:#fff8ea; --muted:#b8c0ef; --gold:#ffc94d; --gold-d:#e09a1a; --gold-l:#fff1b8;
  --ok:#5fe3b8; --pink:#ff8fb8; --steel:#dfe5ff;
  --display:'Black Han Sans','Jua','Malgun Gothic',sans-serif;
  --round:'Jua','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --tech:'Chakra Petch','Bahnschrift','Consolas',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:clamp(14px,1.15vw,20px);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}
[hidden]{display:none!important}

/* ---------- 배경 ---------- */
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(1200px 700px at 15% 0%,#3a2f8f 0%,transparent 60%),
  radial-gradient(900px 600px at 95% 15%,#5a2a7a 0%,transparent 60%),
  radial-gradient(1000px 700px at 50% 110%,#16508a 0%,transparent 60%),
  linear-gradient(180deg,#171d48,#121738)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.floaters{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;font-size:clamp(28px,3.2vw,56px);opacity:.16;filter:saturate(.6);animation:drift linear infinite}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}

/* ---------- 상단 바 ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:20;height:clamp(52px,6.2vh,70px);display:flex;align-items:center;gap:16px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(14,18,48,.85),rgba(14,18,48,.35));backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.25em;letter-spacing:.02em;white-space:nowrap}
.brand .bk{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--gold-l),var(--gold) 45%,var(--gold-d));color:#5a3a00;box-shadow:0 0 18px rgba(255,201,77,.55)}
.top-stickers{display:flex;gap:8px;margin:0 auto}
.slot{width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;font-size:1.05em;border:2px dashed rgba(255,255,255,.22);color:rgba(255,255,255,.35);font-family:var(--round)}
.slot.got{border:2px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 60%);box-shadow:0 0 14px var(--c);font-size:1.25em}
.tools{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;padding:.45em .9em;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-family:var(--round);white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.16)}
.chip.on{background:var(--gold);color:#3d2700;border-color:var(--gold)}
.icon-btn{width:2.3em;height:2.3em;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.icon-btn:hover{background:rgba(255,255,255,.18)}

/* ---------- 화면 ---------- */
.screen{position:fixed;inset:0;z-index:5;padding:calc(clamp(52px,6.2vh,70px) + 2vh) max(16px,env(safe-area-inset-right,0px)) 2vh max(16px,env(safe-area-inset-left,0px));
  display:none;overflow:auto}
.screen.active{display:block;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--round);letter-spacing:.18em;font-size:.82em;color:var(--gold);text-transform:uppercase}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.75em 1.5em;border-radius:18px;font-family:var(--round);font-size:1.1em;
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.18)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,var(--gold-l),var(--gold) 40%,var(--gold-d));color:#3d2700;border-color:#fff3c4;box-shadow:0 6px 0 #a96d06,0 10px 30px rgba(255,201,77,.45)}
.btn.gold:hover{box-shadow:0 8px 0 #a96d06,0 14px 40px rgba(255,201,77,.6)}
.btn.gold:active{box-shadow:0 2px 0 #a96d06}
.btn.big{font-size:1.45em;padding:.8em 2em;border-radius:24px}
.btn.sm{font-size:.92em;padding:.5em 1em;border-radius:12px}
.btn.ghost{background:transparent}
.btn.room{background:linear-gradient(180deg,#fff,var(--c));color:#251a40;border-color:#fff;box-shadow:0 6px 0 color-mix(in oklab,var(--c) 55%,#000),0 10px 30px color-mix(in oklab,var(--c) 50%,transparent)}

/* ---------- 홈 ---------- */
.home{min-height:100%;display:grid;place-items:center;text-align:center}
.home-inner{display:grid;gap:2.4vh;justify-items:center}
.home-key{width:min(30vw,300px);filter:drop-shadow(0 0 30px rgba(255,201,77,.6));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
.home h1{font-family:var(--display);font-size:clamp(48px,8.5vw,150px);line-height:1;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 10%,var(--gold-l) 45%,var(--gold) 70%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #7a4b00) drop-shadow(0 0 40px rgba(255,201,77,.4))}
.home .tag{font-family:var(--round);font-size:clamp(18px,2vw,34px);color:#fff}
.home .meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{padding:.4em 1em;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-family:var(--round);font-size:.95em}
.home-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:1vh}

/* ---------- 이야기 ---------- */
.story{min-height:100%;display:grid;place-items:center}
.story-frame{width:min(1100px,100%);position:relative;padding:clamp(28px,5vh,64px) clamp(24px,5vw,80px);border-radius:36px;
  background:linear-gradient(160deg,rgba(60,72,170,.65),rgba(36,40,110,.75));border:3px solid rgba(255,255,255,.25);
  box-shadow:0 0 0 10px rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.4),inset 0 0 80px rgba(120,160,255,.2)}
.signal{display:flex;align-items:center;gap:10px;font-family:var(--round);color:var(--ok);letter-spacing:.12em;font-size:.95em}
.signal i{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.story-text{font-family:var(--round);font-size:clamp(26px,3.4vw,58px);line-height:1.45;min-height:4.4em;margin:3vh 0 2vh;word-break:keep-all}
.story-text .cur{display:inline-block;width:.45em;height:1em;background:var(--gold);vertical-align:-.12em;margin-left:4px;animation:blink .7s infinite}
.story-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.story-mascot{position:absolute;right:clamp(16px,3vw,48px);top:-46px;font-size:72px;animation:bob 2.6s ease-in-out infinite}

/* ---------- 지도(복도) ---------- */
.map{display:grid;gap:3vh;min-height:100%;align-content:center;justify-items:center}
.map-head{text-align:center;display:grid;gap:.6vh}
.map-head h1{font-family:var(--display);font-size:clamp(34px,4.6vw,80px);color:#fff;text-shadow:0 4px 0 #2b2a7a,0 0 30px rgba(140,160,255,.6)}
.map-head p{margin:0;font-family:var(--round);color:var(--muted);font-size:1.1em}
.hall{display:flex;gap:clamp(12px,2vw,36px);justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:2vh 0 0;position:relative}
.hall::after{content:"";position:absolute;left:-4%;right:-4%;bottom:-14px;height:28px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent)}
.door-card{display:grid;gap:12px;justify-items:center;text-align:center;width:clamp(150px,15vw,250px);transition:transform .25s}
.door-card:hover{transform:translateY(-8px)}
.door-card.locked{cursor:not-allowed}
.door-card.locked:hover{transform:none;animation:nope .35s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dlabel{display:grid;gap:4px}
.dlabel b{font-family:var(--round);font-size:1.2em;font-weight:400}
.dlabel span{font-size:.88em;color:var(--muted)}
.dlabel em{font-style:normal;font-family:var(--round);font-size:.85em;padding:.25em .8em;border-radius:99px;justify-self:center;background:rgba(255,255,255,.1)}
.door-card.open .dlabel em{background:var(--c);color:#251a40;animation:pulseC 1.6s infinite}
.door-card.escaped .dlabel em{background:#fff;color:#251a40}
@keyframes pulseC{50%{box-shadow:0 0 0 6px color-mix(in oklab,var(--c) 30%,transparent)}}
.map-foot{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* 문 (공통) */
.door{position:relative;width:100%;aspect-ratio:3/4.3;border-radius:50% 50% 12px 12px/26% 26% 12px 12px;padding:9%;
  background:linear-gradient(180deg,#ffe6a8,#c99238);box-shadow:0 0 0 4px #7a4f12,0 18px 40px rgba(0,0,0,.45)}
.door .leaf{position:absolute;inset:7%;border-radius:50% 50% 8px 8px/26% 26% 8px 8px;overflow:hidden;
  background:
   radial-gradient(circle at 50% 20%,rgba(255,255,255,.35),transparent 45%),
   linear-gradient(90deg,rgba(0,0,0,.18),transparent 12%,transparent 88%,rgba(0,0,0,.18)),
   linear-gradient(180deg,color-mix(in oklab,var(--c) 85%,#fff),color-mix(in oklab,var(--c) 70%,#3a1d6e));
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),inset 0 -20px 40px rgba(0,0,0,.18)}
.door .leaf::before,.door .leaf::after{content:"";position:absolute;left:14%;right:14%;border-radius:10px;border:3px solid rgba(255,255,255,.35);box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}
.door .leaf::before{top:30%;height:26%}
.door .leaf::after{top:62%;height:26%}
.door .num{position:absolute;top:10%;left:50%;transform:translateX(-50%);z-index:2;width:28%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff,var(--gold-l) 30%,var(--gold) 70%,var(--gold-d));color:#5a3a00;font-family:var(--display);font-size:clamp(20px,2.4vw,42px);box-shadow:0 4px 0 #8a5a0c,0 0 20px rgba(255,201,77,.6)}
.door .emblem{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:2;font-size:clamp(34px,4vw,66px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.door .knob{position:absolute;right:16%;top:60%;width:9%;aspect-ratio:1;border-radius:50%;z-index:2;background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 50%,var(--gold-d));box-shadow:0 2px 0 #7a4f12}
.door .ribbons{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
.door .bigpad{width:42%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.door .bars{position:absolute;left:4%;right:4%;top:50%;height:14%;transform:translateY(-50%) rotate(-8deg);z-index:2;border-radius:10px;
  background:repeating-linear-gradient(90deg,#ff7aa8 0 20px,#ffb3cf 20px 40px);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.door .bars.b2{transform:translateY(-50%) rotate(8deg)}
.door-card.locked .door{filter:saturate(.35) brightness(.7)}
.door-card.open .door{animation:doorGlow 2s ease-in-out infinite}
@keyframes doorGlow{50%{box-shadow:0 0 0 4px #7a4f12,0 0 50px color-mix(in oklab,var(--c) 80%,transparent),0 18px 40px rgba(0,0,0,.45)}}
.door-card.escaped .leaf{transform-origin:left center;transform:perspective(600px) rotateY(-38deg);transition:transform .6s}
.door-card.escaped .door{background:linear-gradient(180deg,#fffbe8,#ffe08a);box-shadow:0 0 0 4px #7a4f12,0 0 60px rgba(255,236,160,.8)}
.door .shine{position:absolute;inset:7%;border-radius:50% 50% 8px 8px/26% 26% 8px 8px;background:radial-gradient(circle at 60% 55%,#fff,#fff6c8 40%,#ffd36b);}
.door .stk{position:absolute;right:-8%;top:-4%;z-index:4;width:38%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(20px,2.3vw,40px);
  background:radial-gradient(circle at 35% 30%,#fff,var(--c) 70%);border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.35);transform:rotate(12deg)}
.mini-locks{display:flex;gap:5px;justify-content:center}
.mini-locks i{width:12px;height:12px;border-radius:4px;background:rgba(255,255,255,.18)}
.mini-locks i.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* ---------- 방 ---------- */
.room{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:clamp(20px,4vw,70px);align-items:center;min-height:100%;max-width:1600px;margin:0 auto}
.room-door-col{display:grid;gap:14px;justify-items:center}
.room-door{width:min(28vw,360px,40vh)}
.room-door .leaf::before,.room-door .leaf::after{display:none}
.room-door .knob{right:9%;top:52%;width:7%}
.room-door .num{top:7%;width:22%}
.room-door .door{padding:0}
.locks{position:absolute;inset:29% 16% 8%;z-index:3;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
.lockbtn{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 6px;border-radius:99px;background:rgba(30,20,70,.35);border:2px solid rgba(255,255,255,.35);transition:transform .2s,background .2s}
.lockbtn:hover{transform:scale(1.07);background:rgba(30,20,70,.55)}
.lockbtn span{font-family:var(--round);font-size:clamp(13px,1.1vw,19px);white-space:nowrap}
.padlock{width:clamp(30px,5.2vh,52px);height:auto;overflow:visible}
.padlock .shk{fill:none;stroke:var(--steel);stroke-width:5;stroke-linecap:round;transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:29px 21px}
.padlock .pb{fill:url(#padGrad)}
.padlock .kh{fill:#6b3f00}
.lockbtn.open{background:rgba(95,227,184,.3);border-color:var(--ok)}
.lockbtn.open .shk{transform:translateY(-6px) rotate(-38deg)}
.lockbtn.open .pb{fill:url(#padOk)}
.lockbtn.pop{animation:lockPop 1s ease both}
@keyframes lockPop{0%{transform:scale(1)}15%{transform:scale(1.15) rotate(-8deg)}30%{transform:scale(1.15) rotate(8deg)}45%{transform:scale(1.2) rotate(-4deg)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
.door-prog{font-family:var(--round);font-size:1.1em;display:flex;gap:10px;align-items:center}
.bar{width:min(28vw,360px);height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),#fff);transition:width 1s}
.room-info{display:grid;gap:2vh;min-width:0}
.room-info h1{font-family:var(--display);font-size:clamp(34px,4.4vw,78px);line-height:1.05;color:#fff;text-shadow:0 5px 0 color-mix(in oklab,var(--c) 45%,#1a1040),0 0 36px color-mix(in oklab,var(--c) 60%,transparent)}
.room-sub{margin:0;font-family:var(--round);color:var(--c);font-size:1.3em}
.room-story{margin:0;font-size:1.12em;line-height:1.7;max-width:46em;color:#e8ebff;word-break:keep-all;padding:1em 1.3em;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.lesson-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.li{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;padding:12px 16px;border-radius:20px;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.1);transition:transform .2s,background .2s,border-color .2s}
.li:hover{transform:translateX(6px);background:rgba(255,255,255,.13)}
.li-no{display:grid;justify-items:center;min-width:4.4em;padding:6px 8px;border-radius:14px;background:rgba(255,255,255,.1);font-family:var(--round);line-height:1.15}
.li-no small{font-size:.75em;color:var(--muted)}
.li-body{display:grid;gap:3px;min-width:0}
.li-body b{font-family:var(--round);font-weight:400;font-size:1.2em}
.li-body span{font-size:.9em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-state{font-family:var(--round);font-size:.9em;padding:.35em .9em;border-radius:99px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:4px;white-space:nowrap}
.li.done{border-color:color-mix(in oklab,var(--ok) 60%,transparent)}
.li.done .li-no{background:var(--ok);color:#0c3a2c}
.li.done .li-state{background:var(--ok);color:#0c3a2c}
.li.next{border-color:var(--c);background:color-mix(in oklab,var(--c) 18%,transparent);box-shadow:0 0 24px color-mix(in oklab,var(--c) 35%,transparent)}
.li.next .li-state{background:var(--c);color:#251a40;animation:pulseC 1.6s infinite}
.room-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- 차시 ---------- */
.lesson{max-width:1500px;margin:0 auto;display:grid;gap:2.2vh;min-height:100%;grid-template-rows:auto 1fr auto}
.lesson-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.lesson-head h1{font-family:var(--display);font-size:clamp(34px,4.2vw,76px);line-height:1.08;color:#fff;text-shadow:0 5px 0 color-mix(in oklab,var(--c) 45%,#1a1040)}
.lh-left{display:grid;gap:1vh;min-width:0}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(16px,2.2vw,36px);align-items:start}
.mission{position:relative;padding:clamp(20px,2.4vw,40px);border-radius:28px;color:#2a1f4a;
  background:linear-gradient(180deg,#fffdf5,#fff3d6);box-shadow:0 0 0 6px color-mix(in oklab,var(--c) 70%,#fff),0 20px 50px rgba(0,0,0,.35);transform:rotate(-1deg)}
.mission::before{content:"";position:absolute;top:-16px;left:50%;width:110px;height:30px;transform:translateX(-50%) rotate(2deg);background:color-mix(in oklab,var(--c) 60%,#fff);opacity:.85;border-radius:4px}
.mission h3{font-family:var(--round);font-size:1.15em;color:color-mix(in oklab,var(--c) 55%,#3a1d6e);display:flex;gap:8px;align-items:center;letter-spacing:.06em}
.mission .mtext{font-family:var(--round);font-size:clamp(22px,2.1vw,38px);line-height:1.45;margin:1.4vh 0 2vh;word-break:keep-all}
.mission textarea{width:100%;min-height:7em;font:inherit;font-family:var(--round);font-size:1.2em;padding:12px;border-radius:14px;border:2px dashed #c9b88a;background:#fffef8;color:#2a1f4a;margin:1.4vh 0}
.mission .btn{color:#3a2f6a;border-color:#d8cba5;background:#fff}
.book{display:flex;gap:8px;align-items:flex-start;font-size:.9em;color:#5b5175;line-height:1.5;padding-top:1.4vh;border-top:2px dashed #e6d7ad}
.mats{display:grid;gap:14px;min-width:0}
.mats h3{font-family:var(--round);font-size:1.15em;display:flex;gap:8px;align-items:center;color:var(--muted);letter-spacing:.06em}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.mat{position:relative;display:grid;border-radius:22px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);overflow:hidden;transition:transform .2s,border-color .2s}
.mat:hover{transform:translateY(-4px);border-color:var(--c)}
.mat-open{display:grid;gap:8px;justify-items:start;text-align:left;padding:18px}
.mat-ic{width:2.6em;height:2.6em;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#251a40;font-size:1.1em}
.mat-ic .ic{width:1.4em;height:1.4em}
.mat-t{font-family:var(--round);font-size:1.2em;word-break:keep-all}
.mat-s{font-size:.85em;color:var(--muted)}
.mat-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:rgba(0,0,0,.25)}
.mat-edit{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 14px}
.mat-edit small{font-size:.8em;color:var(--muted);align-self:center}
.mat.builtin{border-color:color-mix(in oklab,var(--gold) 45%,transparent)}
.mat-badge{font-family:var(--round);font-weight:400;font-size:.9em;padding:.1em .6em;border-radius:99px;background:var(--gold);color:#3d2700}
.mat-edit input{flex:1 1 100%;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font:inherit}
.mini{width:2.2em;height:2.2em;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.mini:hover{background:rgba(255,255,255,.22)}
.mini.del:hover{background:#ff6b8a}
.empty{padding:24px;border-radius:22px;border:2px dashed rgba(255,255,255,.2);color:var(--muted);line-height:1.6;text-align:center}
.add-panel{display:grid;gap:12px;padding:16px;border-radius:22px;background:rgba(255,201,77,.08);border:2px dashed rgba(255,201,77,.45)}
.add-panel .row{display:flex;gap:8px;flex-wrap:wrap}
.add-panel p{margin:0;font-size:.85em;color:var(--muted);line-height:1.55}
.link-form{display:grid;gap:8px}
.link-form input,.link-form select{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font:inherit;min-width:0}
.lesson-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:1vh}
.done-badge{display:flex;align-items:center;gap:10px;font-family:var(--round);font-size:1.3em;color:var(--ok)}
.edit-only{display:none!important}
body.edit .edit-only{display:flex!important}
body.edit .edit-only.grid{display:grid!important}

/* ---------- 오버레이 공통 ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;overflow:hidden}
.overlay.show{display:grid}
#fx{position:fixed;inset:0;z-index:80;pointer-events:none}

/* 문 열림 전환 */
#trans{background:radial-gradient(circle at 50% 50%,color-mix(in oklab,var(--c) 40%,#1c1f55),#0e1130 70%);perspective:1400px}
.t-door{position:relative;width:min(46vh,40vw);aspect-ratio:3/4.3;transition:transform .9s cubic-bezier(.6,0,.4,1),opacity .9s}
.t-frame{position:absolute;inset:0;border-radius:50% 50% 14px 14px/26% 26% 14px 14px;background:linear-gradient(180deg,#ffe6a8,#c99238);box-shadow:0 0 0 6px #7a4f12,0 0 80px color-mix(in oklab,var(--c) 70%,transparent)}
.t-light{position:absolute;inset:6%;border-radius:50% 50% 8px 8px/26% 26% 8px 8px;background:radial-gradient(circle,#fff,#fff6c8 35%,color-mix(in oklab,var(--c) 60%,#fff) 70%)}
.t-leaf{position:absolute;top:6%;bottom:6%;width:44%;transition:transform 1s cubic-bezier(.6,0,.3,1);
  background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.3),transparent 50%),linear-gradient(180deg,color-mix(in oklab,var(--c) 85%,#fff),color-mix(in oklab,var(--c) 65%,#3a1d6e));box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.t-leaf.l{left:6%;border-radius:100% 0 0 0/26% 0 0 0 ;border-top-left-radius:100% 26%;border-bottom-left-radius:8px;transform-origin:left center}
.t-leaf.r{right:6%;border-top-right-radius:100% 26%;border-bottom-right-radius:8px;transform-origin:right center}
.t-plate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;text-align:center;display:grid;gap:4px;padding:18px 26px;border-radius:22px;
  background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#4a2f00;box-shadow:0 8px 0 #9a6608,0 0 40px rgba(255,201,77,.6);transition:opacity .4s,transform .4s;min-width:60%}
.t-plate small{font-family:var(--round);letter-spacing:.3em}
.t-plate b{font-family:var(--display);font-size:clamp(50px,7vw,110px);line-height:1}
.t-plate span{font-family:var(--round);font-size:clamp(16px,1.6vw,28px)}
#trans.open .t-leaf.l{transform:rotateY(-105deg)}
#trans.open .t-leaf.r{transform:rotateY(105deg)}
#trans.open .t-plate{opacity:0;transform:translate(-50%,-50%) scale(.6)}
#trans.zoom .t-door{transform:scale(4.5);opacity:0}
#trans .t-title{position:absolute;bottom:8vh;left:0;right:0;text-align:center;font-family:var(--round);font-size:clamp(20px,2.2vw,38px);color:#fff;animation:fadeUp .6s .2s both}

/* 탈출 성공 */
#escape,#final{background:radial-gradient(circle at 50% 45%,color-mix(in oklab,var(--c) 45%,#2b2370) 0%,#141338 65%,#0b0b26)}
.rays{position:absolute;left:50%;top:44%;width:180vmax;height:180vmax;transform:translate(-50%,-50%) scale(0);opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,230,150,.22) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);transition:transform 1.2s cubic-bezier(.2,1.2,.3,1),opacity .8s}
.s1 .rays{transform:translate(-50%,-50%) scale(1);opacity:1;animation:spin 30s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) scale(1) rotate(360deg)}}
.halo{position:absolute;left:50%;top:40%;width:60vmin;height:60vmin;border-radius:50%;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,rgba(255,240,180,.85),rgba(255,201,77,.35) 40%,transparent 70%);transition:transform 1s .3s cubic-bezier(.2,1.4,.4,1)}
.s2 .halo{transform:translate(-50%,-50%) scale(1)}
.esc-stage{position:relative;z-index:2;display:grid;justify-items:center;gap:2.2vh;text-align:center;padding:0 16px}
.esc-eyebrow{font-family:var(--round);letter-spacing:.4em;color:var(--gold-l);font-size:clamp(14px,1.4vw,24px);opacity:0;transform:translateY(-20px);transition:all .6s}
.s1 .esc-eyebrow{opacity:1;transform:none}
.esc-key{width:min(46vw,520px);opacity:0;filter:drop-shadow(0 0 40px rgba(255,210,100,.9)) drop-shadow(0 10px 0 rgba(120,70,0,.5))}
.s2 .esc-key{animation:keyIn 1.4s cubic-bezier(.2,.9,.3,1) both,keyFloat 3s 1.4s ease-in-out infinite}
@keyframes keyIn{0%{opacity:0;transform:translateY(60vh) rotate(-720deg) scale(.1)}60%{opacity:1;transform:translateY(-3vh) rotate(12deg) scale(1.18)}80%{transform:rotate(-5deg) scale(.95)}100%{opacity:1;transform:none}}
@keyframes keyFloat{0%,100%{opacity:1;transform:translateY(0) rotate(0)}50%{opacity:1;transform:translateY(-14px) rotate(-3deg)}}
.esc-key .glint{animation:glint 2.4s 1.6s ease-in-out infinite}
@keyframes glint{0%{transform:translateX(-260px)}50%,100%{transform:translateX(260px)}}
.esc-title{font-family:var(--display);font-size:clamp(46px,7.6vw,140px);line-height:1;color:#fff;
  text-shadow:0 6px 0 color-mix(in oklab,var(--c) 50%,#3a1d6e),0 0 40px color-mix(in oklab,var(--c) 80%,transparent),0 0 90px rgba(255,220,120,.5)}
.esc-title span{display:inline-block;opacity:0;transform:translateY(40px) scale(.3)}
.s3 .esc-title span{animation:letter .6s calc(var(--i)*55ms) cubic-bezier(.2,1.6,.4,1) both}
@keyframes letter{to{opacity:1;transform:none}}
.esc-sticker{display:flex;align-items:center;gap:18px;opacity:0}
.s4 .esc-sticker{opacity:1}
.stk-big{width:clamp(90px,10vw,160px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(46px,5.2vw,86px);
  background:radial-gradient(circle at 35% 30%,#fff,var(--c) 65%);border:6px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 40px var(--c)}
.s4 .stk-big{animation:stamp .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{0%{transform:scale(4) rotate(-40deg);opacity:0}60%{transform:scale(.85) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.esc-sticker p{margin:0;text-align:left;font-family:var(--round);font-size:clamp(20px,2vw,36px);line-height:1.3}
.esc-sticker p small{display:block;font-size:.6em;color:var(--gold-l);letter-spacing:.1em}
.esc-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;opacity:0;transform:translateY(20px);transition:all .5s}
.s5 .esc-actions{opacity:1;transform:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.s2 .flash{animation:flash .7s .75s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}

/* 최종 */
.fin-stickers{display:flex;gap:clamp(8px,1.4vw,22px)}
.fin-stickers .stk-big{width:clamp(56px,6vw,100px);font-size:clamp(28px,3vw,52px);border-width:4px;opacity:0}
.s2 .fin-stickers .stk-big{animation:stamp .6s calc(var(--i)*180ms) cubic-bezier(.2,1.5,.4,1) both}
.card-zone{perspective:1400px;opacity:0}
.s4 .card-zone{opacity:1}
.s4 .agent-card{animation:cardIn 1.2s cubic-bezier(.2,1,.3,1) both}
@keyframes cardIn{0%{transform:rotateY(180deg) scale(.4) translateY(40vh)}100%{transform:none}}

/* 요원증 */
/* 신분증 비율(ISO ID-1). 모든 치수는 em → 카드 폭(--w)만 바꾸면 화면·인쇄 모두 같은 모양 */
.agent-card{--w:min(620px,88vw);--ac-gold:#f3c969;--ac-gold-d:#b98322;--ac-ink:#0d1233;--ac-label:#e8c56c;
  width:var(--w);height:calc(var(--w) / 1.586);flex:none;border-radius:calc(var(--w)*.042);position:relative;overflow:hidden;isolation:isolate;
  color:#eef0ff;text-align:left;font-size:calc(var(--w)*.0295);line-height:1.25;
  background:
    radial-gradient(70% 90% at 92% 0%,rgba(110,120,255,.45),transparent 60%),
    radial-gradient(60% 80% at 0% 100%,rgba(150,70,200,.45),transparent 60%),
    linear-gradient(140deg,#121848 0%,#1b2263 48%,#0f1440 100%);
  box-shadow:0 1.2em 3em rgba(0,0,0,.55),0 0 0 .12em rgba(243,201,105,.9)}
.agent-card::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--guil);background-size:100% 100%}
.agent-card::after{content:"";position:absolute;inset:.5em;border-radius:calc(var(--w)*.03);border:.06em solid rgba(243,201,105,.55);pointer-events:none}
.ac-sheen{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 45%,transparent 55%);background-size:250% 100%;animation:acSheen 4.5s ease-in-out infinite}
@keyframes acSheen{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.ac-head{display:flex;align-items:center;gap:.7em;padding:1.05em 1.35em .55em}
.ac-emblem{width:2.5em;height:2.9em;flex:none;filter:drop-shadow(0 .15em .25em rgba(0,0,0,.45))}
.ac-org{display:grid;gap:.15em;min-width:0}
.ac-org b{font-family:var(--display);font-weight:400;font-size:1.3em;letter-spacing:.04em;color:#fff;line-height:1}
.ac-org small{font-family:var(--tech);font-weight:600;font-size:.56em;letter-spacing:.32em;color:var(--ac-label)}
.ac-rank{margin-left:auto;flex:none;font-family:var(--tech);font-weight:700;font-size:.62em;letter-spacing:.24em;padding:.55em 1em .5em;border-radius:.35em;color:#1a1240;
  background:linear-gradient(100deg,#fff1c2,#f3c969 30%,#fff6d6 50%,#e9b24a 75%,#fff1c2)}
.ac-body{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.05em;padding:.35em 1.35em 0;align-items:start}
.ac-left{display:grid;gap:.55em;justify-items:center}
.ac-photo{position:relative;width:6.3em;aspect-ratio:3/4;border-radius:.45em;display:grid;place-items:center;text-align:center;
  background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:.06em solid rgba(255,255,255,.28)}
.ac-photo span{font-family:var(--round);font-size:.68em;line-height:1.4;color:rgba(255,255,255,.55)}
.ac-photo i{position:absolute;width:.9em;height:.9em;border-color:var(--ac-gold);border-style:solid;border-width:0}
.ac-photo i:nth-child(1){left:-.2em;top:-.2em;border-left-width:.14em;border-top-width:.14em}
.ac-photo i:nth-child(2){right:-.2em;top:-.2em;border-right-width:.14em;border-top-width:.14em}
.ac-photo i:nth-child(3){left:-.2em;bottom:-.2em;border-left-width:.14em;border-bottom-width:.14em}
.ac-photo i:nth-child(4){right:-.2em;bottom:-.2em;border-right-width:.14em;border-bottom-width:.14em}
.ac-bar{width:6.3em;height:1.35em;display:block}
.ac-mid{display:grid;gap:.5em;min-width:0}
.ac-kicker{font-family:var(--tech);font-weight:600;font-size:.56em;letter-spacing:.34em;color:var(--ac-label)}
.ac-title{font-family:var(--display);font-size:1.55em;line-height:1;letter-spacing:.02em;margin-top:-.25em;
  background:linear-gradient(180deg,#fff7d6,#f3c969 55%,#c8902a);-webkit-background-clip:text;background-clip:text;color:transparent}
.ac-f{display:grid;gap:.12em;min-width:0}
.ac-f i{font-style:normal;font-family:var(--tech);font-weight:600;font-size:.52em;letter-spacing:.24em;color:var(--ac-label)}
.ac-f b{font-family:var(--round);font-weight:400;font-size:.9em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-f.name b{font-family:var(--display);font-size:var(--nf,1.9em);letter-spacing:.06em;line-height:1.05}
.ac-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45em .9em;padding-top:.45em;border-top:.06em solid rgba(243,201,105,.35)}
.ac-f .mono{font-family:var(--tech);font-weight:700;letter-spacing:.08em}
.ac-right{display:grid;gap:.7em;justify-items:end}
.ac-chip{width:3.1em;height:2.35em;display:block}
.ac-holo{position:relative;width:4.6em;height:4.6em;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:conic-gradient(from 20deg,#ffd9f5,#c8f3ff,#d6ffd8,#fff5c4,#ffd0e6,#d7d3ff,#c8f3ff,#ffd9f5);
  box-shadow:inset 0 0 0 .14em rgba(255,255,255,.7),0 .2em .6em rgba(0,0,0,.35)}
.ac-holo::before{content:"";position:absolute;inset:.42em;border-radius:50%;border:.06em dashed rgba(40,30,90,.55)}
.ac-holo span{position:relative;font-family:var(--tech);font-weight:700;font-size:.5em;line-height:1.25;letter-spacing:.14em;color:#2a1f5c}
.ac-holo span b{display:block;font-family:var(--display);font-weight:400;font-size:1.9em;letter-spacing:.02em;line-height:1.05}
.ac-medals{display:flex;align-items:center;gap:.38em;margin-top:.15em}
.ac-medals em{width:1.85em;height:1.85em;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.95em;
  background:radial-gradient(circle at 35% 30%,#fff,var(--c) 72%);box-shadow:0 0 0 .1em var(--ac-gold),0 .12em .3em rgba(0,0,0,.4)}
.ac-medals em .key-stk{width:100%;height:100%}
.ac-medals em{background:none}
.ac-medals small{font-family:var(--tech);font-weight:700;font-size:.55em;letter-spacing:.2em;color:var(--ac-label);margin-left:.4em;line-height:1.3}
.ac-mrz{position:absolute;left:0;right:0;bottom:0;padding:.55em 1.35em .6em;font-family:var(--tech);font-weight:600;font-size:.6em;letter-spacing:.3em;
  color:rgba(255,255,255,.75);background:rgba(5,8,30,.55);border-top:.1em solid rgba(243,201,105,.45);white-space:nowrap;overflow:hidden}

/* 발표 화면 */
#presenter{background:#07081c;display:none;grid-template-rows:auto 1fr;place-items:stretch}
#presenter.show{display:grid}
.p-bar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.05);transition:opacity .3s}
.p-bar .t{font-family:var(--round);font-size:1.1em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-count{font-family:var(--round);font-variant-numeric:tabular-nums;color:var(--muted)}
.p-stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden}
.p-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none}
.p-stage iframe{width:100%;height:100%;border:0;background:#fff}
.p-zone{position:absolute;top:0;bottom:0;width:35%;z-index:2;cursor:pointer}
.p-zone.l{left:0}.p-zone.r{right:0}
.p-prog{position:absolute;left:0;bottom:0;height:5px;background:var(--gold);transition:width .3s;z-index:3}
.p-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:3;padding:.5em 1.2em;border-radius:99px;background:rgba(0,0,0,.55);font-size:.9em;color:var(--muted);transition:opacity .6s}
#presenter.idle .p-bar{opacity:0}
#presenter.idle .p-hint{opacity:0}

/* 모달 */
.modal-back{position:fixed;inset:0;z-index:70;background:rgba(8,10,30,.7);backdrop-filter:blur(6px);display:none;place-items:center;padding:16px}
.modal-back.show{display:grid}
.modal{width:min(820px,100%);max-height:88vh;overflow:auto;border-radius:28px;background:linear-gradient(180deg,#2a3380,#1f2766);border:2px solid rgba(255,255,255,.2);box-shadow:0 30px 80px rgba(0,0,0,.5);padding:clamp(18px,3vw,36px);display:grid;gap:22px}
.modal h2{font-family:var(--display);font-size:2em}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set-sec{display:grid;gap:10px;padding:18px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.set-sec h3{font-family:var(--round);font-size:1.2em;color:var(--gold)}
.set-sec p{margin:0;font-size:.88em;color:var(--muted);line-height:1.6}
.set-sec label{display:grid;gap:6px;font-family:var(--round);font-size:.95em}
.set-sec input,.set-sec textarea,.set-sec select{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.28);color:#fff;font:inherit;font-family:var(--body);min-width:0;width:100%}
.set-sec textarea{min-height:8em;line-height:1.6;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.dialog{width:min(520px,100%);text-align:center;justify-items:center}
.dialog p{font-family:var(--round);font-size:1.3em;line-height:1.5;margin:0;word-break:keep-all}

#toast{position:fixed;left:50%;bottom:4vh;transform:translate(-50%,30px);z-index:90;padding:.8em 1.5em;border-radius:99px;background:#fff;color:#251a40;font-family:var(--round);font-size:1.05em;opacity:0;transition:all .35s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}

#print{display:none}

@media (max-width:860px){
  .room{grid-template-columns:1fr;justify-items:center}
  .room-door{width:min(70vw,320px)}
  .bar{width:min(70vw,320px)}
  .lesson-grid{grid-template-columns:1fr}
  .top-stickers{display:none}
  .brand span.nm{display:none}
  .tools{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .floaters{display:none}
}

/* 열쇠 스티커 (화면·인쇄 공통 그림) */
.key-stk{display:block;width:100%;height:100%;overflow:visible}
.stk-svg{background:none!important;border:0!important;font-size:0!important;border-radius:50%}
.slot.got{background:none;border:0;padding:0}
.slot.got .key-stk{filter:drop-shadow(0 0 6px var(--c))}

/* ---------- 인쇄물: A4 한 장 = .pg 하나 (mm 단위 = 실제 크기) ---------- */
.pg{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;color:#1f1b3a;font-family:var(--body);break-after:page;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg .ac-sheen{display:none}
.pg.cards{padding:14mm 12mm;display:grid;grid-template-columns:repeat(2,90mm);grid-auto-rows:calc(90mm / 1.586);gap:6mm;justify-content:center;align-content:start}
.pg.cards .agent-card{--w:90mm;box-shadow:none}
.pg-foot{position:absolute;left:0;right:0;bottom:6mm;text-align:center;font-size:3mm;color:#8a84a6;font-family:var(--round)}

/* 스티커 도안 */
.pg.stickers{padding:10mm 9mm}
.sh-head{display:flex;align-items:center;gap:4mm;height:16mm;padding:0 2mm;border-bottom:.4mm dashed #d6cfe8;margin-bottom:6mm}
.sh-head .key-stk{width:12mm;height:12mm}
.sh-head b{font-family:var(--display);font-weight:400;font-size:6.5mm;color:#1b2263;line-height:1}
.sh-head span{display:block;font-family:var(--round);font-size:3.3mm;color:#6b6590;margin-top:1mm}
.sh-head em{margin-left:auto;font-style:normal;font-family:var(--tech);font-weight:700;font-size:3mm;letter-spacing:.12em;color:#fff;background:var(--c);padding:1.6mm 3mm;border-radius:2mm}
.sh-grid{display:grid;grid-template-columns:repeat(5,36mm);grid-auto-rows:36mm;gap:5mm 3.5mm;justify-content:center}
.sh-cell{position:relative;width:36mm;height:36mm}
.sh-cell::before{content:"";position:absolute;inset:-.9mm;border-radius:50%;border:.25mm dashed #b9b3cf}

/* 열쇠 수집판 */
.pg.board{padding:9mm 10mm;display:grid;grid-template-rows:42mm 1fr 30mm;gap:4mm}
.bd-head{position:relative;border-radius:6mm;overflow:hidden;color:#fff;display:flex;align-items:center;gap:5mm;padding:0 7mm;
  background:radial-gradient(70% 120% at 100% 0%,rgba(110,120,255,.55),transparent 60%),radial-gradient(60% 120% at 0% 100%,rgba(150,70,200,.5),transparent 60%),linear-gradient(140deg,#121848,#1b2263 55%,#0f1440)}
.bd-head::before{content:"";position:absolute;inset:0;background-image:var(--guil);background-size:100% 100%;opacity:.9}
.bd-head::after{content:"";position:absolute;inset:2mm;border-radius:4.5mm;border:.3mm solid rgba(243,201,105,.6)}
.bd-head>*{position:relative;z-index:1}
.bd-emb{width:17mm;height:20mm;flex:none}
.bd-title{display:grid;gap:1.4mm;min-width:0}
.bd-title small{font-family:var(--tech);font-weight:600;font-size:2.6mm;letter-spacing:.3em;color:#f3c969}
.bd-title b{font-family:var(--display);font-weight:400;font-size:10.5mm;line-height:1;background:linear-gradient(180deg,#fff7d6,#f3c969 60%,#d39a35);-webkit-background-clip:text;background-clip:text;color:transparent}
.bd-title span{font-family:var(--round);font-size:3.6mm;color:#dfe3ff}
.bd-name{margin-left:auto;flex:none;width:52mm;padding:3mm 4mm;border-radius:3mm;background:#fffaf0;color:#1b2263;display:grid;gap:1mm}
.bd-name i{font-style:normal;font-family:var(--tech);font-weight:700;font-size:2.4mm;letter-spacing:.2em;color:#b98322}
.bd-name b{font-family:var(--display);font-weight:400;font-size:7mm;line-height:1.15;min-height:8mm;border-bottom:.3mm solid #d8cba5;white-space:nowrap;overflow:hidden}
.bd-name span{font-family:var(--round);font-size:2.6mm;color:#6b6590}
.bd-body{position:relative;border-radius:6mm;background:radial-gradient(circle,#efe7d2 .35mm,transparent .4mm) 0 0/6mm 6mm,#fffaf0;border:.35mm solid #eadfc3}
.bd-path{position:absolute;inset:0;width:100%;height:100%}
.bd-st{position:absolute;width:40mm;height:40mm;margin:-20mm 0 0 -20mm}
.bd-slot{position:absolute;inset:0;border-radius:50%;background:#fff;border:.7mm dashed var(--c);display:grid;place-items:center;text-align:center;
  box-shadow:0 0 0 2mm color-mix(in oklab,var(--c) 22%,#fff)}
.bd-ghost{position:absolute;inset:1.3mm;opacity:.2;filter:grayscale(1)}
.bd-slot span{position:relative;font-family:var(--round);font-size:3.2mm;line-height:1.3;padding:1.2mm 2.6mm;border-radius:3mm;background:rgba(255,255,255,.9);color:color-mix(in oklab,var(--c) 45%,#2a1d48)}
.bd-slot span b{display:block;font-family:var(--display);font-weight:400;font-size:6mm}
.bd-tag{position:absolute;width:98mm;margin-top:-15mm;padding:3mm 4mm;border-radius:4mm;background:#fff;border:.35mm solid #eadfc3;box-shadow:0 1mm 0 #eadfc3;display:grid;gap:1.2mm}
.bd-tag .rm{display:flex;align-items:center;gap:2mm}
.bd-tag .rm em{font-style:normal;font-family:var(--tech);font-weight:700;font-size:2.7mm;letter-spacing:.16em;padding:.8mm 2.4mm;border-radius:1.5mm;background:var(--c);color:#24183f}
.bd-tag .rm small{font-family:var(--round);font-size:2.8mm;color:#8a84a6}
.bd-tag b{font-family:var(--round);font-weight:400;font-size:5.4mm;line-height:1.1;color:#1b2263}
.bd-tag span{font-size:3mm;color:#6b6590;line-height:1.35}
.bd-checks{display:flex;align-items:center;gap:1.6mm;font-family:var(--round);font-size:2.7mm;color:#8a84a6}
.bd-checks i{width:6.2mm;height:6.2mm;border-radius:1.4mm;border:.35mm solid color-mix(in oklab,var(--c) 70%,#555);display:grid;place-items:center;font-style:normal;font-family:var(--tech);font-weight:700;font-size:2.4mm;color:color-mix(in oklab,var(--c) 55%,#333)}
.bd-foot{position:relative;border-radius:6mm;display:flex;align-items:center;gap:5mm;padding:0 7mm;color:#3d2700;
  background:linear-gradient(100deg,#fff1c2,#f3c969 35%,#fff3cf 55%,#e8b04a);border:.4mm solid #c9952e}
.bd-foot svg{width:22mm;height:20mm;flex:none}
.bd-foot b{font-family:var(--display);font-weight:400;font-size:6.6mm;line-height:1.1;display:block}
.bd-foot span{font-family:var(--round);font-size:3.4mm}
.bd-holes{margin-left:auto;display:flex;gap:2mm}
.bd-holes i{width:8mm;height:8mm;border-radius:50%;background:#1b2263;box-shadow:inset 0 .6mm 0 rgba(0,0,0,.4),0 0 0 .6mm #fff6d6;display:grid;place-items:center}
.bd-holes i::after{content:"";width:1.6mm;height:3.4mm;border-radius:.8mm .8mm .3mm .3mm;background:#f3c969}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
}

const FileDB = (() => {
  let dbp = null; const mem = new Map();
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(res => {
      try{ const r = indexedDB.open('mulgun-escape', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files');
        r.onsuccess = () => res(r.result); r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  const tx = (db, mode, fn) => new Promise((res, rej) => { const t = db.transaction('files', mode); const out = fn(t.objectStore('files')); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); });
  return {
    async put(id, rec){ const db = await open(); if(!db){ mem.set(id, rec); return; } await tx(db, 'readwrite', s => s.put(rec, id)); },
    async get(id){ const db = await open(); if(!db) return mem.get(id); try{ return await tx(db, 'readonly', s => s.get(id)); }catch(e){ return null; } },
    async del(id){ const db = await open(); if(!db){ mem.delete(id); return; } try{ await tx(db, 'readwrite', s => s.delete(id)); }catch(e){} },
    async clear(){ const db = await open(); if(!db){ mem.clear(); return; } await tx(db, 'readwrite', s => s.clear()); }
  };
})();

async function fileUrl(id){
  if(urlCache.has(id)) return urlCache.get(id);

}

function tone(f, t0, dur, type='triangle', vol=.15, slide){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain(), st = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, st); if(slide) o.frequency.exponentialRampToValueAtTime(slide, st + dur);
  g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(vol, st + .015); g.gain.exponentialRampToValueAtTime(.0001, st + dur);
  o.connect(g).connect(a.destination); o.start(st); o.stop(st + dur + .05);
}
function noise(t0, dur, f1, f2, vol=.2){
  const a = ac(); if(!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain(), st = a.currentTime + t0;
  src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(f1, st); bp.frequency.exponentialRampToValueAtTime(f2, st + dur);
  g.gain.setValueAtTime(.0001, st); g.gain.linearRampToValueAtTime(vol, st + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, st + dur);
  src.connect(bp).connect(g).connect(a.destination); src.start(st);
}

  }

  function star(r){ x.beginPath(); for(let i = 0; i < 10; i++){ const rr = i % 2 ? r * .45 : r; const a = i * Math.PI / 5 - Math.PI / 2; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } x.closePath(); x.fill(); }
  function tick(){
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, innerWidth, innerHeight);
    P = P.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for(const p of P){
      p.vy += p.g; p.vx *= .985; p.vy *= .985; p.x += p.vx + Math.sin(p.wob += .1) * .6; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      x.save(); x.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.color;
      if(p.kind === 'rect'){ x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2 * (1 + Math.sin(p.wob))); }
      else if(p.kind === 'circle'){ x.beginPath(); x.arc(0, 0, p.r / 2.4, 0, Math.PI * 2); x.fill(); }
      else { x.shadowColor = p.color; x.shadowBlur = 10; star(p.r / 1.6); }
      x.restore();
    }
    if(P.length) requestAnimationFrame(tick); else { running = false; x.clearRect(0, 0, innerWidth, innerHeight); }
  }
  return {burst, rain, sparkleAt};
})();

/* 별 하늘 배경 + 떠다니는 물건 */
(function stars(){
  const c = $('#stars'), x = c.getContext('2d'); let S2 = [], dpr = 1;
  const make = () => { dpr = Math.min(2, devicePixelRatio || 1); c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    S2 = Array.from({length:Math.round(innerWidth * innerHeight / 9000)}, () => ({x:Math.random() * innerWidth, y:Math.random() * innerHeight, r:Math.random() * 1.6 + .3, p:Math.random() * 6, s:.01 + Math.random() * .03})); };
  addEventListener('resize', make); make();
  (function draw(){ x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, innerWidth, innerHeight);
    for(const s of S2){ s.p += s.s; x.globalAlpha = .35 + Math.sin(s.p) * .35; x.fillStyle = '#fff'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill(); }
    if(!reduced) requestAnimationFrame(draw); })();
  const objs = ['✏️', '☂️', '🎒', '✂️', '📏', '🧽', '📎', '🖍️', '🧦', '⏰', '🔦', '🧲', '🪀', '📐'];
  $('#floaters').innerHTML = objs.map((o, i) => `<span style="left:${(i * 7.3 + 3) % 96}%;animation-duration:${26 + (i * 7) % 20}s;animation-delay:-${(i * 5.3) % 30}s">${o}</span>`).join('');
})();

  };

function typeText(el, text){
  if(typer) typer.stop();
  let k = 0, timer = null; const t = {busy:true};
  t.stop = () => { clearTimeout(timer); t.busy = false; };
  t.finish = () => { t.stop(); el.innerHTML = esc(text); };
  (function step(){ if(k >= text.length){ t.busy = false; el.innerHTML = esc(text); return; }
    k++; el.innerHTML = esc(text.slice(0, k)) + '<span class="cur"></span>'; if(k % 2) SFX.type();
    timer = setTimeout(step, text[k - 1] === ' ' ? 30 : (/[.!?,]/.test(text[k - 1]) ? 260 : 55)); })();
  el.onclick = () => t.busy && t.finish();
  typer = t;
}

/* ---------- 기본 자료: GitHub 저장소의 materials 폴더 ----------
   GitHub Pages가 materials/files.json 에 폴더 안 파일 목록을 적어 준다.
   폴더 이름의 첫 숫자 = 차시. 이미지는 슬라이드 묶음, PDF는 PDF, links.txt는 링크, 나머지는 첨부 파일. */
let BUILTIN = {};
const assetUrl = p => p.split('/').map(encodeURIComponent).join('/');
const builtinMats = n => (BUILTIN[n] || []).map((m, k) => ({...m, id:`b${n}-${k}`, builtin:true})).filter(m => !(S.hidden || {})[m.id]);
const natural = (a, b) => a.localeCompare(b, 'ko', {numeric:true});
const EMBED_HOSTS = /docs\.google\.com\/presentation|youtube\.com|youtu\.be|canva\.com/;
async function parseLinks(path){
  try{
    const t = await (await fetch(assetUrl(path), {cache:'no-cache'})).text();
    return t.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#')).map(line => {
      let [title, url, mode] = line.split('|').map(s => (s || '').trim());
      if(!url){ url = title; title = '링크 자료'; }
      /* 저장소 안의 수업 화면(lessons/…html) → 앱 안에서 띄우는 '수업' 자료 */
      if(mode === '수업' || /^(\.\/)?lessons\//.test(url)) return {type:'lesson', title, url:url.replace(/^\.\//, '')};
      if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
      return {type:EMBED_HOSTS.test(url) && mode !== '새창' ? 'embed' : 'link', title, url};
    });
  }catch(e){ return []; }
}
async function loadBuiltin(){
  let paths;
  try{
    const r = await fetch('materials/files.json', {cache:'no-cache'});
    if(!r.ok) return;
    paths = await r.json();
  }catch(e){ return; /* 파일로 열었거나 기본 자료가 없으면 건너뜀 */ }
  const groups = {};
  for(const raw of paths){
    const rel = String(raw).replace(/^\/?materials\//, ''), parts = rel.split('/');
    if(parts.length < 2) continue;
    const n = parseInt((parts[0].match(/\d+/) || [])[0], 10);
    if(!(n >= 1 && n <= 24)) continue;
    const sub = parts.length > 2 ? parts[1] : '';
    ((groups[n] = groups[n] || {})[sub] = groups[n][sub] || []).push('materials/' + rel);
  }
  const out = {};
  for(const n of Object.keys(groups)){
    const items = [];
    for(const sub of Object.keys(groups[n]).sort(natural)){
      const files = groups[n][sub].sort((a, b) => natural(a.split('/').pop(), b.split('/').pop()));
      const name = p => p.split('/').pop(), ext = p => (name(p).match(/\.([^.]+)$/) || [])[1]?.toLowerCase() || '';
      const imgs = files.filter(p => /^(png|jpe?g|gif|webp)$/.test(ext(p)));
      if(imgs.length) items.push({type:'slides', title:sub || `${n}차시 수업 PPT`, files:imgs});
      for(const p of files){
        if(imgs.includes(p) || /^(md|html|json)$/.test(ext(p))) continue;
        if(name(p).toLowerCase() === 'links.txt'){ items.push(...await parseLinks(p)); continue; }
        const title = name(p).replace(/\.[^.]+$/, '');
        items.push(ext(p) === 'pdf' ? {type:'pdf', title, files:[p]} : {type:'file', title, fileName:name(p), files:[p]});
      }
    }
    out[n] = items.filter(m => m.type === 'lesson').concat(items.filter(m => m.type !== 'lesson')); /* 수업 화면을 맨 앞에 */
  }
  BUILTIN = out;
  if(view.screen === 'lesson') rerender();
}
function pickFiles(accept, multiple, cb){
  const inp = $('#fileIn'); inp.value = ''; inp.accept = accept; inp.multiple = multiple;
  inp.onchange = () => { if(inp.files.length) cb([...inp.files]); }; inp.click();
}
const sortFiles = files => files.sort((a, b) => a.name.localeCompare(b.name, 'ko', {numeric:true}));
async function storeFiles(files){ const ids = []; for(const f of files){ const id = uid(); await FileDB.put(id, {blob:f, name:f.name, type:f.type}); ids.push(id); } return ids; }
function addMaterial(l, type){
  const list = mats(l.n);
  if(type === 'slides') pickFiles('image/*', true, async files => {
    toast('슬라이드를 저장하는 중…'); const ids = await storeFiles(sortFiles(files));
    list.push({id:uid(), type:'slides', title:`${l.n}차시 수업 PPT`, files:ids}); save(); rerender(); toast(`슬라이드 ${ids.length}장을 넣었어요`);

  });

      list.push({id:uid(), type:$('#lfMode').value, title:$('#lfTitle').value.trim() || '링크 자료', url}); save(); rerender();

function embedUrl(u){
  try{
    const x = new URL(u), h = x.hostname;
    if(h.includes('docs.google.com') && x.pathname.includes('/presentation/')){
      const m = x.pathname.match(/\/presentation\/d\/(e\/)?([^/]+)/);
      if(m) return `https://docs.google.com/presentation/d/${m[1] ? 'e/' : ''}${m[2]}/embed?start=false&loop=false&delayms=60000`;
    }
    if(h.includes('youtube.com') && x.searchParams.get('v')) return 'https://www.youtube.com/embed/' + x.searchParams.get('v');
    if(h === 'youtu.be') return 'https://www.youtube.com/embed' + x.pathname;
    if(h.includes('canva.com') && x.pathname.includes('/design/') && !x.searchParams.has('embed')){ x.pathname = x.pathname.replace(/\/(edit|view|watch)\/?$/, '/view'); x.search = '?embed'; return x.toString(); }
    return u;
  }catch(e){ return u; }
}

let P = null, idleT = null;
async function openMaterial(m){
  if(!m) return;
  if(m.type === 'link'){ window.open(m.url, '_blank', 'noopener'); return; }
  const getUrl = m.builtin ? async p => assetUrl(p) : fileUrl;
  if(m.type === 'file'){
    const u = await getUrl(m.files[0]); if(!u) return toast('파일을 찾을 수 없어요');
    const a = document.createElement('a'); a.href = u; a.download = m.fileName || m.title; document.body.appendChild(a); a.click(); a.remove(); return;
  }
  const pr = $('#presenter');
  P = {m, i:0, urls:[]};
  pr.innerHTML = `<div class="p-bar"><span class="t">${esc(m.title)}</span><span class="p-count" id="pCount"></span>
    ${m.type === 'embed' ? `<a class="btn sm" href="${esc(m.url)}" target="_blank" rel="noopener">${I('ext')} 새 창으로</a>` : ''}
    <button class="icon-btn" id="pFs" title="전체 화면">${I('full')}</button><button class="icon-btn" id="pClose" title="닫기 (Esc)">${I('close')}</button></div>
    <div class="p-stage" id="pStage"></div>`;
  pr.classList.add('show');
  $('#pClose').onclick = closePresenter; $('#pFs').onclick = toggleFs;

    P.urls = await Promise.all(m.files.map(getUrl));
    stage.innerHTML = `<img id="pImg" alt=""><button class="p-zone l" aria-label="이전 슬라이드"></button><button class="p-zone r" aria-label="다음 슬라이드"></button><div class="p-prog" id="pProg"></div><div class="p-hint">← → 키, 화면 클릭, 프레젠터로 넘길 수 있어요 · Esc 닫기</div>`;
    stage.querySelector('.p-zone.l').onclick = () => slide(-1); stage.querySelector('.p-zone.r').onclick = () => slide(1);
    slide(0);
  } else {
    const src = m.type === 'pdf' ? await getUrl(m.files[0]) : m.type === 'lesson' ? assetUrl(m.url) : embedUrl(m.url);
    stage.innerHTML = `<iframe src="${esc(src)}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
    if(m.type === 'lesson'){ const f = stage.querySelector('iframe'); f.onload = () => { try{ f.focus(); }catch(e){} }; }
    $('#pCount').textContent = '';
  }
  wake();
}
function slide(d){
  if(!P || P.m.type !== 'slides') return;
  const n = P.urls.length; if(!n) return;
  P.i = Math.max(0, Math.min(n - 1, P.i + d));
  $('#pImg').src = P.urls[P.i] || '';
  $('#pCount').textContent = `${P.i + 1} / ${n}`; $('#pProg').style.width = ((P.i + 1) / n * 100) + '%';
  [P.i + 1, P.i + 2].forEach(k => { if(P.urls[k]){ const im = new Image(); im.src = P.urls[k]; } });
}
function closePresenter(){ $('#presenter').classList.remove('show'); $('#presenter').innerHTML = ''; P = null; }
function wake(){ const pr = $('#presenter'); pr.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => pr.classList.add('idle'), 2500); }
$('#presenter').addEventListener('mousemove', wake);

        <button class="btn" id="eMap">${I('map')} 탈출 지도</button>

  ov.className = 'overlay show';
  SFX.whoosh();

  await wait(500); ov.classList.add('s3');

  if($('#eFinal')) $('#eFinal').onclick = () => { close(); showFinal(); };

/* 요원증 배경의 지폐 같은 물결 무늬(길로셰)를 한 번 만들어 CSS 변수로 둔다 */
(function guilloche(){
  const W = 600, H = 380; let waves = '', rose = '';
  for(let k = 0; k < 16; k++){
    let d = '';
    for(let x = 0; x <= W; x += 5){ const y = H * .62 + Math.sin(x / 38 + k * .42) * (14 + k * 5) * Math.sin(x / 160 + k * .18); d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1); }
    waves += `<path d="${d}"/>`;
  }
  for(let k = 0; k < 10; k++){
    let d = '';
    for(let t = 0; t <= 360; t += 2){ const a = t * Math.PI / 180, r = 62 + 16 * Math.sin(9 * a + k * .32) + k * 2.2; d += (t ? 'L' : 'M') + (505 + r * Math.cos(a)).toFixed(1) + ' ' + (205 + r * Math.sin(a)).toFixed(1); }
    rose += `<path d="${d}Z"/>`;
  }
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H}' preserveAspectRatio='none'><g fill='none' stroke='#b9b2ff' stroke-opacity='.16' stroke-width='.7'>${waves}</g><g fill='none' stroke='#f3c969' stroke-opacity='.2' stroke-width='.7'>${rose}</g></svg>`;
  document.documentElement.style.setProperty('--guil', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
})();
function barcodeSVG(seed){
  let h = 2166136261; for(const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  const rnd = () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0) % 1000) / 1000;
  let x = 0, bars = '';
  while(x < 118){ const w = 1 + Math.floor(rnd() * 3); if(rnd() > .35) bars += `<rect x="${x}" y="0" width="${w}" height="30"/>`; x += w + 1; }
  return `<svg class="ac-bar" viewBox="0 0 120 30" preserveAspectRatio="none" aria-hidden="true"><g fill="#f4ecd6">${bars}</g></svg>`;
}

      <h1 class="esc-title" style="font-size:clamp(40px,6.4vw,120px)">${[...'최종 탈출 성공!'].map((ch, i) => `<span style="--i:${i}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')}</h1>
      <div class="fin-stickers">${ROOMS.map((r, i) => `<div class="stk-big stk-svg" style="--c:${r.color};--i:${i}">${keySticker(r)}</div>`).join('')}</div>

        <button class="btn gold big" id="fPrint">${I('print')} 요원증 인쇄하기</button>
        <button class="btn" id="fMap">${I('map')} 탈출 지도</button>
      </div></div>`;
  f.className = 'overlay show'; SFX.whoosh();
  await wait(250); f.classList.add('s1', 's3'); SFX.final();
  await wait(700); f.classList.add('s2'); FX.burst({n:260, speed:20});
  await wait(1300); f.classList.add('s4'); FX.rain(6000);
  await wait(1200); f.classList.add('s5'); FX.burst({x:innerWidth * .1, y:innerHeight, n:100, angle:-Math.PI / 3, spread:.7, speed:24}); FX.burst({x:innerWidth * .9, y:innerHeight, n:100, angle:-Math.PI * 2 / 3, spread:.7, speed:24});
  $('#fPrint').onclick = () => printCards();
  $('#fMap').onclick = () => { f.className = 'overlay'; f.innerHTML = ''; go('map'); };
}
/* ---------- 인쇄물: 요원증 · 열쇠 스티커 도안 · 열쇠 수집판 ---------- */
const roster = () => (cls().roster || '').split(/\n/).map(s => s.trim()).filter(Boolean);
const chunk = (a, n) => Array.from({length:Math.ceil(a.length / n)}, (_, i) => a.slice(i * n, i * n + n));
const emblemSVG = (cls, id) => `<svg class="${cls}" viewBox="0 0 50 58" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c8"/><stop offset=".5" stop-color="#f3c969"/><stop offset="1" stop-color="#b98322"/></linearGradient></defs>
  <path d="M25 2 L47 9 V27 C47 41 37 51 25 56 C13 51 3 41 3 27 V9 Z" fill="url(#${id})"/><path d="M25 7 L42 12.5 V27 C42 38 34.5 46 25 50.5 C15.5 46 8 38 8 27 V12.5 Z" fill="#141a4a"/>
  <circle cx="25" cy="21" r="6.5" fill="none" stroke="url(#${id})" stroke-width="3"/><path d="M25 27.5 V42 M25 34 H30 M25 39 H29" stroke="url(#${id})" stroke-width="3" stroke-linecap="round"/></svg>`;
const keyOutline = `<svg viewBox="-30 -16 60 32" aria-hidden="true"><g transform="rotate(-28)" fill="none" stroke="#2a1d48" stroke-width="2.2"><circle cx="-16" cy="0" r="9"/><circle cx="-16" cy="0" r="4"/><path d="M-7 -2.5H24V2.5H21V8H17V2.5H13V6.5H9.5V2.5H-7Z"/></g></svg>`;

function renderPrint(kind, opt = {}){

          return `<div class="bd-st" style="left:${x}mm;top:${y}mm;--c:${r.color}"><div class="bd-slot"><div class="bd-ghost">${keySticker(r)}</div><span>${r.no}번 방 열쇠<br>붙이는 곳</span></div></div>

            <b>${esc(r.place)}</b><span>${esc(r.title)}</span>
            <div class="bd-checks">미션 ${r.lessons.map(l => `<i>${l.n}</i>`).join('')}</div></div>`; }).join('')}
      </div>
      <div class="bd-foot">
        <svg viewBox="0 0 60 54" aria-hidden="true"><rect x="4" y="20" width="52" height="30" rx="4" fill="#1b2263"/><path d="M4 22 Q4 6 30 6 Q56 6 56 22Z" fill="#2c3590"/><rect x="4" y="18" width="52" height="6" fill="#f3c969"/><rect x="25" y="26" width="10" height="13" rx="2" fill="#f3c969"/><circle cx="30" cy="31" r="1.8" fill="#1b2263"/><rect x="29.2" y="31" width="1.6" height="4.5" fill="#1b2263"/><path d="M10 6l1.5 3 3 .5-2.2 2 .6 3-2.9-1.5-2.9 1.5.6-3-2.2-2 3-.5z" fill="#fff"/></svg>
        <div><b>열쇠 5개를 모두 모으면 최종 탈출!</b><span>물건 비밀 연구소의 공식 「물건 비밀 요원증」이 발급돼요.</span></div>
        <div class="bd-holes"><i></i><i></i><i></i><i></i><i></i></div>

function printDoc(kind, opt){
  renderPrint(kind, opt);
  if((kind === 'cards' || kind === 'board') && !roster().length) toast('설정에 학생 명단을 넣으면 이름이 들어간 인쇄물이 나와요');
  setTimeout(() => window.print(), 400);
}
const printCards = () => printDoc('cards');

/* ---------- 설정 ---------- */
function openSettings(){
  const m = $('#modal'), c = cls();
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="설정">
    <div class="modal-head"><h2>선생님 설정</h2><button class="icon-btn" id="xClose">${I('close')}</button></div>
    <div class="set-sec"><h3>우리 반</h3>
      <div class="row"><label style="flex:1 1 220px">반 이름 (예: 2학년 3반)<input id="xName" value="${esc(c.name)}"></label>
      <label style="flex:1 1 220px">소속 (예: 새싹초 2학년 3반)<input id="xSchool" value="${esc(S.school)}" placeholder="비우면 반 이름이 들어가요"></label></div>
      <label>연구소 이름<input id="xAgency" value="${esc(S.agency)}"></label>
      <label>학생 명단 (한 줄에 한 명)<textarea id="xRoster" placeholder="김하늘&#10;이바다&#10;박구름">${esc(c.roster)}</textarea></label>
    </div>
    <div class="set-sec"><h3>인쇄물</h3>
      <p>모두 A4 용지에 <b>실제 크기(100%)</b>로 인쇄하세요. 인쇄 창의 "추가 설정"에서 배율을 "기본값/100", 여백을 "없음"으로 두면 크기가 정확해요. 수집판과 요원증은 학생 명단의 이름이 한 장씩 들어가요.</p>
      <div class="row">
        <button class="btn sm" id="xBoard">${I('key')} 열쇠 수집판 (한 명당 1장)</button>
        <button class="btn sm" id="xPrint">${I('card')} 요원증 (한 장에 8명)</button>
      </div>
      <div class="row">
        <select id="xStkRoom" style="flex:0 1 220px" aria-label="스티커 도안 방 선택"><option value="0">스티커 도안 · 5개 방 모두 (5장)</option>${ROOMS.map(r => `<option value="${r.no}">스티커 도안 · ${r.no}번 방만 (1장)</option>`).join('')}</select>
        <button class="btn sm" id="xStk">${I('print')} 열쇠 스티커 도안 인쇄</button>
      </div>
      <p>스티커는 지름 36mm, 한 장에 30개예요. A4 전지 스티커 용지(라벨지)에 인쇄해 점선을 따라 오리면 수집판의 40mm 자리에 쏙 들어가요.</p>
    </div>
    <div class="set-sec"><h3>도입 이야기</h3><p>한 줄이 화면 한 장면이에요.</p>
      <textarea id="xStory">${esc(storyLines().join('\n'))}</textarea>
      <div class="row"><button class="btn sm" id="xStoryReset">기본 이야기로 되돌리기</button></div>
    </div>
    <div class="set-sec"><h3>진행 상황</h3>
      <p>해결한 미션 ${Object.keys(c.done).length}/24 · 스티커 ${stickerCount()}/5<br>
      <b>자료 편집</b>을 켜면 잠긴 방에도 들어갈 수 있고, 차시 화면에서 해결을 취소할 수 있어요.</p>
      <div class="row"><button class="btn sm" id="xResetProg">${I('trash')} 진행 처음부터 다시</button></div>
    </div>
    <div class="set-sec"><h3>백업</h3>
      <p>모든 내용(진행 상황, 슬라이드, 파일)은 이 컴퓨터의 이 브라우저에만 저장돼요. 다른 컴퓨터로 옮기거나 혹시 모를 상황에 대비해 가끔 백업 파일로 내보내 두세요.</p>
      <div class="row"><button class="btn sm" id="xExport">백업 파일 내보내기</button><button class="btn sm" id="xImport">백업 파일 불러오기</button></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn gold" id="xSave">저장하고 닫기</button></div>
  </div>`;
  m.classList.add('show');
  const commit = () => {
    const k = cls(); k.name = $('#xName').value.trim() || k.name; k.roster = $('#xRoster').value;
    S.agency = $('#xAgency').value.trim() || '물건 비밀 연구소'; S.school = $('#xSchool').value.trim();
    const lines = $('#xStory').value.split('\n').map(s => s.trim()).filter(Boolean);
    S.story = lines.join('\n') === DEFAULT_STORY.join('\n') ? null : lines; save();
  };
  const close = () => { m.classList.remove('show'); m.innerHTML = ''; rerender(); };
  $('#xClose').onclick = () => { commit(); close(); };
  $('#xSave').onclick = () => { commit(); close(); toast('저장했어요'); };
  m.onclick = e => { if(e.target === m){ commit(); close(); } };
  $('#xPrint').onclick = () => { commit(); printDoc('cards'); };
  $('#xBoard').onclick = () => { commit(); printDoc('board'); };
  $('#xStk').onclick = () => { commit(); printDoc('stickers', {room:+$('#xStkRoom').value}); };
  $('#xStoryReset').onclick = () => { $('#xStory').value = DEFAULT_STORY.join('\n'); };
  $('#xResetProg').onclick = async () => {
    if(!(await ask('자물쇠와 스티커를 모두 처음 상태로 돌릴까요?', '처음부터'))) return;
    const k = cls(); k.done = {}; k.escaped = {}; save(); openSettings(); toast('처음 상태로 돌렸어요');
  };
  $('#xExport').onclick = () => { commit(); exportBackup(); };
  $('#xImport').onclick = () => { const inp = $('#importIn'); inp.value = ''; inp.onchange = () => inp.files[0] && importBackup(inp.files[0]); inp.click(); };
}
const blobToData = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
function dataToBlob(d){ const [h, b64] = d.split(','), type = (h.match(/data:([^;]*)/) || [])[1] || ''; const bin = atob(b64), u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type}); }
async function exportBackup(){
  toast('백업 파일을 만드는 중…');
  const files = {};
  for(const list of Object.values(S.materials)) for(const m of list) for(const id of (m.files || [])){
    const rec = await FileDB.get(id); if(rec) files[id] = {name:rec.name, type:rec.type, data:await blobToData(rec.blob)};
  }
  const blob = new Blob([JSON.stringify({app:'mulgun-escape', v:1, state:S, files})], {type:'application/json'});
  const d = new Date(), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `물건비밀연구소_백업_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  document.body.appendChild(a); a.click(); a.remove(); toast('백업 파일을 내보냈어요');
}
async function importBackup(file){
  try{
    const data = JSON.parse(await file.text());
    if(data.app !== 'mulgun-escape') throw new Error('형식');
    if(!(await ask('백업 파일을 불러오면 지금 내용이 백업 내용으로 바뀌어요. 계속할까요?', '불러오기'))) return;
    await FileDB.clear(); urlCache.clear();
    for(const [id, f] of Object.entries(data.files || {})) await FileDB.put(id, {blob:dataToBlob(f.data), name:f.name, type:f.type});
    S = Object.assign(defaults(), data.state); save();
    $('#modal').classList.remove('show'); go('home'); toast('백업을 불러왔어요');
  }catch(e){ toast('이 앱의 백업 파일이 아니에요. 파일을 다시 확인해 주세요.'); }
}

/* ---------- 상단 버튼 · 키보드 ---------- */
function toggleFs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }catch(e){} }
$('#brandBtn').onclick = () => go('home');
$('#setBtn').onclick = () => openSettings();
$('#fsBtn').onclick = toggleFs;
$('#soundBtn').onclick = () => { S.sound = !S.sound; save(); renderTop(); if(S.sound) SFX.unlock(); };
$('#editBtn').onclick = () => { editMode = !editMode; document.body.classList.toggle('edit', editMode); toast(editMode ? '자료 편집을 켰어요. 잠긴 방에도 들어갈 수 있어요.' : '자료 편집을 껐어요'); rerender(); };

/* 수업 화면(lessons/…)이 '차시 미션 완료'를 알려 오면 자물쇠를 연다 — {type:'lesson-complete', lesson:차시 번호} */
addEventListener('message', e => {
  const d = e.data || {};
  if(e.origin !== location.origin || d.type !== 'lesson-complete') return;
  const l = lessonOf(d.lesson); if(!l) return;
  const c = cls();
  setTimeout(() => {
    closePresenter();
    if(c.done[l.n]){ toast(`${l.n}차시는 이미 해결한 미션이에요`); return; }
    c.done[l.n] = today(); save(); go('room', {room:l.room, unlock:l.n});
  }, 1400);
});

addEventListener('keydown', e => {
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if($('#presenter').classList.contains('show')){
    if(['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)){ e.preventDefault(); slide(1); }
    else if(['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)){ e.preventDefault(); slide(-1); }
    else if(e.key === 'Home'){ slide(-999); } else if(e.key === 'End'){ slide(999); }
    else if(e.key === 'Escape'){ closePresenter(); }
    else if(e.key === 'f' || e.key === 'F'){ toggleFs(); }
    wake(); return;
  }
  if(e.key === 'f' || e.key === 'F') toggleFs();
  if(view.screen === 'story' && (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown')){ e.preventDefault(); $('#sNext') && $('#sNext').click(); }
  if(view.screen === 'story' && (e.key === 'ArrowLeft' || e.key === 'PageUp')){ $('#sPrev') && $('#sPrev').click(); }
  if(e.key === 'Escape'){ if($('#modal').classList.contains('show')) $('#xClose').click(); }
});

go('home');
loadBuiltin();
</script>

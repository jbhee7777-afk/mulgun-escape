<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>6차시 물건 디자이너 아이디어 종이</title>
<link rel="stylesheet" href="../fonts/jua.css"><link rel="stylesheet" href="../fonts/gowun-dodum.css">
<style>
/* 실험 카드·활동지와 같은 꾸밈 */
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#22313a;--sub:#6b7b84;--line:#d7e3e6;--teal:#127d74;--teal2:#e8f6f4}
body{font-family:'Gowun Dodum','Malgun Gothic',sans-serif;color:var(--ink);background:#ddd;word-break:keep-all}
.page{width:210mm;height:297mm;margin:0 auto;position:relative;overflow:hidden;background:#fff;padding:12mm 14mm;display:flex;flex-direction:column;gap:5mm}
.top{display:flex;align-items:flex-end;gap:5mm;padding-bottom:3.5mm;border-bottom:.6mm solid var(--ink)}
.top .tag{font-size:9pt;color:var(--teal);font-weight:700;letter-spacing:.3mm}
.top h1{font-family:'Jua',sans-serif;font-weight:400;font-size:24pt;line-height:1.1}
.top .who{margin-left:auto;display:flex;gap:3mm;font-size:11pt;color:var(--sub)}
.top .who span{border-bottom:.35mm solid #b9cfd2;min-width:30mm;padding-bottom:1mm}
.tip{background:var(--teal2);border-radius:3mm;padding:3mm 5mm;font-size:11pt;line-height:1.6;color:#0e5a54}
.tip b{font-family:'Jua',sans-serif;font-weight:400}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5mm}
.box{border:.4mm solid var(--line);border-radius:4mm;padding:4mm 5mm;display:flex;flex-direction:column;gap:2.5mm}
.box .hd{display:flex;align-items:center;gap:3mm}
.box .no{font-family:'Jua',sans-serif;font-size:11pt;color:#fff;background:var(--teal);border-radius:50%;width:8mm;height:8mm;display:flex;align-items:center;justify-content:center;flex:none}
.box .ln{flex:1;display:flex;align-items:flex-end;gap:2mm;font-size:10.5pt;color:var(--sub)}
.box .ln i{flex:1;border-bottom:.35mm solid #b9cfd2;height:6mm;font-style:normal}
.draw{flex:1;border:.35mm dashed #a9c4c8;border-radius:3mm;position:relative;min-height:60mm}
.draw::before{content:"✏️ 생김새를 바꾼 내 아이디어 그림";position:absolute;left:3mm;top:2mm;font-size:9pt;color:#9ab3b7}
.say{font-size:10.5pt;color:var(--sub);line-height:2}
.say i{display:inline-block;border-bottom:.35mm solid #b9cfd2;width:28mm;height:5mm;vertical-align:bottom;font-style:normal}
.foot{display:flex;justify-content:space-between;font-size:9pt;color:var(--sub)}
@media print{body{background:none}.page{margin:0}}
</style></head>
<body><div class="page">
  <div class="top">
    <div><div class="tag">2번 방 · 6차시 · 미션 3</div><h1>물건 디자이너 아이디어 종이</h1></div>
    <div class="who">번호 <span></span> 이름 <span></span></div>
  </div>
  <div class="tip">💡 화면에 나온 물건의 <b>불편한 일</b>을 해결하려면 <b>생김새를 어떻게 바꾸면 좋을까요?</b> 정답은 하나가 아니에요. 떠오르는 대로 마음껏 그려 보세요!</div>
  <div class="grid">
    <div class="box"><div class="hd"><span class="no">1</span><div class="ln">물건 <i></i></div></div><div class="ln">불편한 일 <i></i></div><div class="draw"></div><div class="say">생김새를 <i></i> 바꾸면 <i></i> 편해져요.</div></div>
    <div class="box"><div class="hd"><span class="no">2</span><div class="ln">물건 <i></i></div></div><div class="ln">불편한 일 <i></i></div><div class="draw"></div><div class="say">생김새를 <i></i> 바꾸면 <i></i> 편해져요.</div></div>
    <div class="box"><div class="hd"><span class="no">3</span><div class="ln">물건 <i></i></div></div><div class="ln">불편한 일 <i></i></div><div class="draw"></div><div class="say">생김새를 <i></i> 바꾸면 <i></i> 편해져요.</div></div>
    <div class="box"><div class="hd"><span class="no">4</span><div class="ln">물건 <i></i></div></div><div class="ln">불편한 일 <i></i></div><div class="draw"></div><div class="say">생김새를 <i></i> 바꾸면 <i></i> 편해져요.</div></div>
  </div>
  <div class="foot"><span>물건 교과서 · 물건을 자세히 탐구하기</span><span>생김새에는 비밀이 있다</span></div>
</div></body></html>
